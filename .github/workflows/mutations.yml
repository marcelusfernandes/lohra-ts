name: mutations

# Mutation testing por fatia (issue #156, épico #13; required desde #225).
# `plan` lê scripts/mutations/slices.json e o diff base...head e escolhe as
# fatias; `mutate` roda uma por job; `mutations` (nome fixo) resume e é o
# check que o ruleset exige. Sem filtro de paths: em PR sem src/ o `plan`
# devolve count 0, `mutate` é pulado e o resumo passa em segundos.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mutations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: fatias que o diff exige
        id: matrix
        # Sem pipe: o shell default do Actions não tem pipefail e `| tee`
        # engoliria o exit code do script (mesmo idioma de ci.yml/provenance).
        run: |
          set +e
          npx tsx scripts/github/mutations-matrix.ts \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" > matrix.json
          status=$?
          {
            echo '## mutations — fatias que o diff exige'
            echo '```json'
            cat matrix.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat matrix.json
          exit $status

  mutate:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    # node-pty compila via node-gyp em `npm ci` (mesma nota de ci.yml).
    env:
      PYTHON: python3
    steps:
      - uses: actions/checkout@v4
        with:
          # os harnesses fazem `git archive <sha>` do candidato
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: ${{ matrix.slice }}
        # O runner imprime o JSON da fatia no stdout (duas fatias mandam o caso
        # vermelho para stderr, por isso `2>&1`); `tee` guarda uma cópia para o
        # artifact abaixo (#323). Aqui o pipe é seguro porque `pipefail` está
        # ligado — ao contrário do passo `plan`, que evita o pipe de propósito.
        run: |
          set -o pipefail
          mkdir -p .mutation-evidence
          npm run ${{ matrix.script }} 2>&1 | tee ".mutation-evidence/${{ matrix.slice }}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-evidence-${{ matrix.slice }}
          path: .mutation-evidence/
          if-no-files-found: warn

  # Job-resumo de nome fixo (#225): é ele que o ruleset exige. Roda sempre;
  # verde quando `mutate` passou ou foi pulado (count 0), vermelho quando
  # `plan` não terminou em success ou alguma fatia falhou/foi cancelada.
  mutations:
    needs: [plan, mutate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: veredito das fatias
        env:
          PLAN: ${{ needs.plan.result }}
          MUTATE: ${{ needs.mutate.result }}
        run: |
          echo "plan=$PLAN mutate=$MUTATE"
          if [ "$PLAN" != "success" ]; then echo "::error::plan terminou em $PLAN"; exit 1; fi
          case "$MUTATE" in
            success|skipped) echo "mutations: ok ($MUTATE)"; exit 0;;
            *) echo "::error::mutate terminou em $MUTATE"; exit 1;;
          esac
