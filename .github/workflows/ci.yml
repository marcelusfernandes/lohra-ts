name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `edited` faz `escopo` rerodar quando o orquestrador acrescenta
    # `authorised:` ao corpo da PR (revisão da PR #52).
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    # Dependências nativas no runner (declaradas de propósito): node-pty traz
    # prebuild linux-x64/arm64 embutido desde 1.2.0-beta.8 (D10, #549) e
    # better-sqlite3 baixa o prebuild linux-x64 na instalação — nenhum dos dois
    # compila via node-gyp; o job `pack-check` abaixo prende isso. Nenhum teste
    # spawna python3 (#165, tests/sem-python.test.ts prende).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: install
        run: npm ci
      # test ANTES de build: prova a cada run que a suíte não depende de dist/
      # (#2, PR #105). typecheck e lint vêm depois do build porque scripts de
      # paridade no include do tsconfig importam de dist/ (#108).
      - name: test
        id: test
        run: npm test
      - name: build
        id: build
        run: npm run build
      - name: typecheck
        id: typecheck
        run: npm run typecheck
      - name: lint
        id: lint
        run: npm run lint
      - name: format:check
        id: format
        run: npm run format:check

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Todo SHA aprovado em docs/provenance.json precisa ser ancestral do HEAD.
      # Transforma o invariante de proveniência de prosa em gate. Push em main
      # é estrito; pull_request tolera `pending` com SHA real (--pending-ok,
      # #160). O --json vai para o step summary sem engolir o exit code.
      - name: approved heads are ancestors of HEAD
        env:
          PENDING_OK: ${{ github.event_name == 'pull_request' && '--pending-ok' || '' }}
        run: |
          set +e
          # --silent tira o banner do npm do stdout: só o JSON vai para o arquivo.
          npm run --silent provenance:check -- --json $PENDING_OK > provenance.json
          status=$?
          {
            echo '## provenance'
            echo '```json'
            cat provenance.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat provenance.json
          exit $status

  # ---- checks de PR (épico #34) ------------------------------------------
  # Só em pull_request: cada um lê o payload do evento (base/head/corpo).
  # `fetch-depth: 0` porque os scripts fazem `git diff base...head`.
  # Reprodução local (dry-run, sem gh/git): README seção "CI".
  escopo:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # o diff da PR cabe nos globs de `## Files` da issue ligada por Closes #N
      - name: escopo
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run ci:escopo

  contratos:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # paths proibidos (docs/reference, lohra), imports proibidos (após #17),
      # arquivo > 800 linhas
      - name: contratos
        run: npm run ci:contratos

  controle-negativo:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # os testes do diff, aplicados sobre a base da PR, precisam reprovar
      # (`npm run prova -- <slug>` na base). Reprova em vacuous-pass, em
      # structural-red sem test(red): válido, em feature sem prova/<slug>.ts e
      # em base que não roda a prova; PR de classe docs/process é SKIP.
      # head.sha, nunca github.sha (merge sintético). Detalhe: README "CI".
      - name: controle-negativo
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: npm run ci:controle-negativo -- --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$HEAD_REF"

  # Instalação por pacote (D3/#532, épico #529): empacota, instala o tarball num
  # consumidor limpo e roda o CLI contra o stub — em Linux e macOS, Node 20/22 —
  # e falha se better-sqlite3/node-pty tiverem compilado nativo em vez de usar
  # prebuild (scripts/pack-check.ts, assertNoNativeCompileNeeded). O `npm ci`
  # do projeto vem antes para primar ~/.npm/_prebuilds no mesmo HOME (o
  # consumidor instala offline). Não é required no ruleset (gate humano).
  pack-check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: install
        run: npm ci
      - name: build
        run: npm run build
      - name: pack:check
        run: npm run pack:check
